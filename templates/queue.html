<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queue · Recaply</title>
{% include "_theme.html" %}
<style>
  .wrap { max-width: var(--page); margin: 0 auto; padding: 0 24px; }
  .head { padding: 40px 0 8px; }
  .head h1 { font-size: clamp(26px, 3.2vw, 38px); line-height: 1.15; margin: 10px 0; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; padding-top: 18px; }
  .panel { padding: 20px; }
  .panel h3 { font-size: 17px; margin: 0 0 12px; }
  .panel .field { width: 100%; margin-bottom: 8px; }
  .panel textarea.field { min-height: 130px; font-family: inherit; }
  .panel .note { font-size: 14px; color: var(--muted); line-height: 1.45; margin: 8px 0 0; }
  .counts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; align-items: center; }
  .pill { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--fill); color: var(--muted); }
  .pill.running { background: rgb(var(--accent-rgb) / .14); color: var(--accent); }
  .pill.failed, .pill.cancelled { background: rgb(var(--hot-rgb) / .14); color: var(--hot); }
  .pill.ready, .pill.done { background: rgb(46 182 125 / .16); color: #1f9d6b; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 12px 4px; border-bottom: 1px solid var(--fill); align-items: center; }
  .row:last-child { border-bottom: 0; }
  .row .t { font-weight: 600; overflow-wrap: anywhere; }
  .row .t a { color: inherit; }
  .row .sub { color: var(--muted); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .row .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .bar { height: 6px; border-radius: 99px; background: var(--fill); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--grad); }
  .empty { color: var(--muted); padding: 14px 4px; }
  h2.sec { font-size: 18px; margin: 26px 0 8px; }
  .res { font-size: 14px; margin-top: 8px; line-height: 1.5; overflow-wrap: anywhere; }
  .res .bad { color: var(--danger); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="glow"></div>
{% set active = 'queue' %}{% include "_nav.html" %}
<div class="wrap">
  <div class="head"><span class="kicker"><i></i>Queue</span><h1>Batch queue and publishing</h1></div>
  <div class="layout">
    <div>
      <div class="card panel">
        <div class="counts" id="counts"></div>
        <div id="jobs"><div class="empty">Loading…</div></div>
        <div style="margin-top:12px"><button class="btn sm" type="button" id="b-retry">Retry all failed</button></div>
      </div>
      <h2 class="sec" id="pub-h" {% if not desktop %}hidden{% endif %}>Publishing schedule</h2>
      <div class="card panel" id="pub-box" {% if not desktop %}hidden{% endif %}><div id="pub"><div class="empty">Nothing scheduled.</div></div></div>
    </div>
    <aside class="card panel">
      <h3>Add many videos</h3>
      <textarea class="field" id="in" placeholder="One link per line{% if desktop %} (or a file path){% endif %}&#10;https://www.youtube.com/watch?v=…&#10;https://www.twitch.tv/videos/…"></textarea>
      <select class="field" id="o-profile">{% for p in profiles %}<option value="{{ p.key }}">{{ p.label }}</option>{% endfor %}</select>
      <select class="field" id="o-count"><option value="5">5 clips each</option><option value="10" selected>10 clips each</option><option value="20">20 clips each</option></select>
      <select class="field" id="o-length"><option value="auto">Clip length: auto</option><option value="short">15-30 s</option><option value="medium">30-60 s</option><option value="long">60-90 s</option></select>
      <button class="btn" type="button" id="b-add" style="width:100%">Start all</button>
      <div class="res" id="res"></div>
      <p class="note">Jobs run a few at a time. Only add videos you have the right to clip.</p>
    </aside>
  </div>
</div>
<footer>Recaply</footer>
<script>
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  async function api(url, method, body) {
    const r = await fetch(url, { method: method || "GET", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Something went wrong."); return d;
  }
  const when = t => new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  function renderJobs(jobs, counts) {
    const c = $("counts"); c.textContent = "";
    Object.entries(counts).forEach(([k, v]) => c.append(el("span", "pill " + k, `${v} ${k}`)));
    const box = $("jobs"); box.textContent = "";
    if (!jobs.length) { box.append(el("div", "empty", "No jobs yet. Add videos on the right.")); return; }
    jobs.forEach(j => {
      const row = el("div", "row"), left = el("div");
      const t = el("div", "t"), a = el("a", null, j.title); a.href = "/clipjob/" + j.id; t.append(a); left.append(t);
      left.append(el("div", "sub", `${when(j.created)} · ${j.state === "running" || j.state === "queued" ? j.stage : (j.error || j.stage)}`));
      if (j.state === "running") { const b = el("div", "bar"), i = el("i"); i.style.width = Math.round(100 * j.progress) + "%"; b.append(i); left.append(b); }
      const acts = el("div", "acts"); acts.append(el("span", "pill " + j.state, j.state));
      if (j.state === "queued") { const b = el("button", "btn sm", "Cancel"); b.onclick = async () => { await api(`/api/queue/${j.id}/cancel`, "POST"); load(); }; acts.append(b); }
      if (j.state === "failed" || j.state === "cancelled") { const b = el("button", "btn sm", "Retry"); b.onclick = async () => { try { await api(`/api/clipjob/${j.id}/retry`, "POST"); load(); } catch (e) { alert(e.message); } }; acts.append(b); }
      if (j.state === "ready" || j.state === "failed" || j.state === "cancelled") { const b = el("button", "btn sm", "Delete"); b.onclick = async () => { if (confirm("Delete this job and its clips?")) { await api(`/api/clipjob/${j.id}`, "DELETE"); load(); } }; acts.append(b); }
      row.append(left, acts); box.append(row);
    });
  }
  function renderPub(items) {
    const box = $("pub"); box.textContent = "";
    if (!items.length) { box.append(el("div", "empty", "Nothing scheduled. Publish a short from a clip's editor page.")); return; }
    items.forEach(it => {
      const row = el("div", "row"), left = el("div"), t = el("div", "t");
      t.append(document.createTextNode(`${it.title} → ${it.platform}`)); left.append(t);
      let sub = `${it.status === "queued" ? "at " : ""}${when(it.run_at)}`;
      if (it.status === "done" && it.result && it.result.url) { const a = el("a", null, it.result.url); a.href = it.result.url; a.target = "_blank"; a.rel = "noopener"; const s = el("div", "sub", sub + " · "); s.append(a); left.append(s); }
      else left.append(el("div", "sub", sub + (it.error ? " · " + it.error : "") + (it.attempts && it.status !== "done" ? ` (try ${it.attempts})` : "")));
      const acts = el("div", "acts"); acts.append(el("span", "pill " + (it.status === "uploading" ? "running" : it.status), it.status));
      if (it.status === "queued" || it.status === "failed") { const b = el("button", "btn sm", "Cancel"); b.onclick = async () => { await api(`/api/publish/${it.id}/cancel`, "POST"); load(); }; acts.append(b); }
      if (it.status === "failed" || it.status === "cancelled") { const b = el("button", "btn sm", "Retry"); b.onclick = async () => { await api(`/api/publish/${it.id}/retry`, "POST"); load(); }; acts.append(b); }
      row.append(left, acts); box.append(row);
    });
  }
  async function load() { try { const s = await api("/api/queue"); renderJobs(s.jobs, s.counts); renderPub(s.publish || []); } catch (_) {} }
  $("b-retry").onclick = async () => { try { const d = await api("/api/queue/retry-failed", "POST"); $("res").textContent = `Retrying ${d.jobs.length} job(s).`; load(); } catch (e) { $("res").textContent = e.message; } };
  $("b-add").onclick = async () => {
    const res = $("res"); res.textContent = "Starting…";
    try {
      const d = await api("/api/batch", "POST", { inputs: $("in").value, options: { profile: $("o-profile").value, count: $("o-count").value, length: $("o-length").value } });
      res.textContent = ""; res.append(el("div", null, `Started ${d.started} of ${d.results.length}.`));
      d.results.filter(r => r.error).forEach(r => res.append(el("div", "bad", `${r.input.slice(0, 60)}: ${r.error}`)));
      if (d.started) $("in").value = ""; load();
    } catch (e) { res.textContent = e.message; }
  };
  load(); setInterval(load, 2500);
</script>
</body>
</html>
