<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipforge</title>
{% if target %}<meta http-equiv="refresh" content="0;url={{ target }}">{% endif %}
{% include "_theme.html" %}
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); }
  .c { text-align: center; padding: 24px; max-width: 520px; }
  .c h1 { font-size: 28px; margin: 0 0 12px; }
  .c p { color: var(--muted); font-size: 17px; margin: 0 0 24px; }
  .bar { width: 180px; height: 5px; border-radius: 9px; background: var(--fill-2); overflow: hidden; margin: 18px auto 0; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 9px; background: var(--accent); animation: m 1.1s ease-in-out infinite; }
  @keyframes m { 0% { transform: translateX(-100%) } 100% { transform: translateX(260%) } }
</style>
</head>
<body>
<div class="c">
  {% if error %}
    <h1>Couldn't open Clipforge</h1>
    <p>{{ error }}</p>
    <a class="btn lg" href="{{ website }}">Back to the website</a>
  {% else %}
    <h1>Opening Clipforge…</h1>
    <div class="bar"><i></i></div>
    <script>location.replace({{ target|tojson }});</script>
  {% endif %}
</div>
</body>
</html>
