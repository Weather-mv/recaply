{# Shared <head> pieces: theme (set before paint), fonts, the design system and page behaviour. #}
<meta name="csrf-token" content="{{ csrf_token() }}">
<meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)">
<script>
  (() => { let t; try { t = localStorage.getItem("rc_theme"); } catch (_) {}
    document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); })();
</script>
