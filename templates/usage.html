<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Usage · Clipforge</title>
{% include "_theme.html" %}
<style>
  .wrap { max-width: var(--page); margin: 0 auto; padding: 0 24px 40px; }
  .head { padding: 40px 0 8px; display: flex; align-items: end; gap: 16px; flex-wrap: wrap; }
  .head h1 { font-size: clamp(26px, 3.2vw, 38px); line-height: 1.15; margin: 10px 0 0; }
  .head .field { margin-left: auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 18px; }
  .tile { padding: 16px 18px; }
  .tile b { display: block; font-family: var(--head); font-size: 26px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-top: 16px; }
  .panel { padding: 20px; }
  .panel h3 { font-size: 17px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px 6px 0; }
  td { padding: 6px 6px 6px 0; border-top: 1px solid var(--fill); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  td.r, th.r { text-align: right; }
  .bars { display: flex; align-items: end; gap: 3px; height: 120px; }
  .bars div { flex: 1; background: var(--grad); border-radius: 4px 4px 0 0; min-height: 2px; }
  .share { height: 6px; background: var(--fill); border-radius: 99px; overflow: hidden; min-width: 60px; }
  .share i { display: block; height: 100%; background: var(--grad); }
  .note { color: var(--muted); font-size: 14px; margin-top: 10px; line-height: 1.45; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<div class="glow"></div>
{% set active = 'usage' %}{% include "_nav.html" %}
<div class="wrap">
  <div class="head">
    <div><span class="kicker"><i></i>Usage</span><h1>Time and cost</h1></div>
    <select class="field" id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last year</option></select>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="grid">
    <div class="card panel"><h3>Videos per day</h3><div class="bars" id="bars"></div><div class="note" id="bars-note"></div></div>
    <div class="card panel"><h3>Where the cost goes</h3><table id="prov"></table><div class="note" id="note"></div></div>
    <div class="card panel"><h3>Where the time goes</h3><table id="stages"></table></div>
    <div class="card panel" id="pub-card" hidden><h3>Publishing</h3><table id="pubt"></table></div>
  </div>
  <div class="card panel" style="margin-top:16px"><h3>Jobs</h3><table id="jobs"></table></div>
</div>
<footer>Clipforge</footer>
<script>
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const usd = v => v == null ? "–" : (v < 0.01 && v > 0 ? "<$0.01" : "$" + v.toFixed(2));
  const dur = s => s == null ? "–" : (s >= 3600 ? (s / 3600).toFixed(1) + " h" : s >= 60 ? Math.round(s / 60) + " min" : Math.round(s) + " s");
  function table(t, head, rows) {
    t.textContent = ""; const h = el("tr"); head.forEach((x, i) => h.append(el("th", i ? "r" : "", x))); t.append(h);
    if (!rows.length) { const r = el("tr"), d = el("td", "empty", "Nothing yet."); d.colSpan = head.length; r.append(d); t.append(r); }
    rows.forEach(cells => { const r = el("tr"); cells.forEach((c, i) => { const d = el("td", i ? "r" : ""); if (c instanceof Node) d.append(c); else d.textContent = c; r.append(d); }); t.append(r); });
  }
  const share = f => { const s = el("div", "share"), i = el("i"); i.style.width = Math.round(f * 100) + "%"; s.append(i); return s; };
  async function load() {
    const d = await (await fetch("/api/usage?days=" + $("days").value)).json(), t = d.totals;
    const tiles = $("tiles"); tiles.textContent = "";
    [[t.jobs + (t.failed ? ` (${t.failed} failed)` : ""), "videos analysed"], [t.video_hours + " h", "of video"], [dur(t.sec_per_video_hour), "processing per video hour"],
     [usd(t.usd), "estimated spend"], [usd(t.usd_per_video), "per video"], [t.clips, "clips found"]].forEach(([v, l]) => {
      const c = el("div", "card tile"); c.append(el("b", null, String(v)), el("span", null, l)); tiles.append(c); });
    const bars = $("bars"); bars.textContent = ""; const max = Math.max(1, ...d.by_day.map(x => x.jobs));
    d.by_day.forEach(x => { const b = el("div"); b.style.height = (100 * x.jobs / max) + "%"; b.title = `${x.day}: ${x.jobs} video(s), ${usd(x.usd)}`; bars.append(b); });
    $("bars-note").textContent = d.by_day.length ? `${d.by_day[0].day} to ${d.by_day[d.by_day.length - 1].day}` : "No videos in this period.";
    table($("prov"), ["Provider", "Usage", "Est. cost"], Object.entries(d.providers).map(([k, v]) => [k, v.kind === "audio" ? v.minutes + " min" : `${v.calls} calls, ${(v.tokens_in + v.tokens_out).toLocaleString()} tokens`, usd(v.usd)]));
    $("note").textContent = d.prices_note;
    table($("stages"), ["Stage", "Share", "Time"], d.stages.slice(0, 12).map(s => [s.name + (s.cached ? " (cache)" : ""), share(s.share), dur(s.sec)]));
    if (d.publish) { $("pub-card").hidden = false; table($("pubt"), ["Status", "Items"], Object.entries(d.publish).map(([k, v]) => [k, v])); }
    table($("jobs"), ["Video", "Length", "Processing", "Cost", "Clips"], d.jobs.map(j => { const a = el("a", null, j.title); a.href = "/clipjob/" + j.id; return [a, j.video_min + " min", dur(j.processing_sec), usd(j.usd), j.clips]; }));
  }
  $("days").onchange = load; load();
</script>
</body>
</html>
